name: Build & deploy flight portfolio

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *" # refresh every 6 hours
  workflow_dispatch:

# Least privilege: read the repo, publish to Pages, nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Volanta data
        env:
          VOLANTA_USERNAME: ${{ vars.VOLANTA_USERNAME }}
        run: |
          if [ -z "$VOLANTA_USERNAME" ]; then
            echo "::warning::Repository variable VOLANTA_USERNAME is not set. Deploying with sample data."
          else
            node scripts/fetch-volanta.mjs "$VOLANTA_USERNAME" site/data/volanta.json
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
